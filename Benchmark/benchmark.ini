# DaedalusX64 benchmark settings
# While this file is in the folder, Daedalus runs every ROM in turn instead of showing the menu.

# --- First pass: a short run of every ROM, to see which ones load ---

# How long each ROM runs, in seconds
Seconds=30

# Start and A are pressed every few seconds for this long, to get past title screens.
# The figures in benchmark.txt are measured after this.
ButtonSeconds=20

# --- Second pass: the ROMs that ran OK in the first pass, run for longer ---
# (set SecondPassSeconds=0 for a single pass)

SecondPassSeconds=90
SecondPassButtonSeconds=30

# --- Both passes ---

# Move on if a game shows no new frame for this long (frozen)
FreezeSeconds=20

# Move on if a game never shows a picture for this long
NoPictureSeconds=30

# Where the ROMs are. Add one Roms= line per folder.
Roms=ms0:/PSP/GAME/DaedalusX64/Roms/
Roms=ms0:/n64/

# Only run ROMs whose file name contains one of these (upper/lower case does not matter).
# With no Only= lines every ROM is run. Example:
# Only=Mario
